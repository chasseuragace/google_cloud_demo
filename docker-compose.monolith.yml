services:
  app:
    build: ./monolith
    ports:
      - "8080:8000"   # same host port as the scalable stack's load balancer
    environment:
      - DATABASE_URL=postgresql+psycopg2://postgres:password@postgres:5432/issues
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: issues
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    volumes:
      - postgres_monolith_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 5s
      retries: 10

volumes:
  postgres_monolith_data:
