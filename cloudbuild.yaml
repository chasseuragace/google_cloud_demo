steps:
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/issues-api', '.']
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/issues-api']
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'issues-api'
      - '--image'
      - 'gcr.io/$PROJECT_ID/issues-api'
      - '--platform=managed'
      - '--region=us-central1'
      - '--allow-unauthenticated'
      - '--set-env-vars'
      - 'DATABASE_URL=postgresql+psycopg2://...'
      - '--set-env-vars'
      - 'DATABASE_URL_READ=postgresql+psycopg2://...'
      - '--set-env-vars'
      - 'REDIS_URL=redis://...'
