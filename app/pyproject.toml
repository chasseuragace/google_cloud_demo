[project]
name = "issues-api"
version = "0.1.0"
description = "Layered FastAPI issues API"
requires-python = ">=3.9"
dependencies = [
  "fastapi>=0.111.0",
  "uvicorn[standard]>=0.30.1",
  "sqlalchemy>=2.0.30",
  "psycopg2-binary>=2.9.9",
  "pydantic>=2.7.4",
  "pydantic-settings>=2.0.0",
  "redis>=5.0.7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "fakeredis>=2.1.0",
  "httpx>=0.27.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
